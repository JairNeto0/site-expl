<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EXPL 💥</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #111;
            color: white;
            text-align: center;
        }

        header {
            background-color: #000;
            padding: 20px;
        }

        header h1 {
            font-size: 40px;
        }

        .logo {
            width: 120px;
        }

        section {
            padding: 30px;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 60%;
            box-shadow: 15px 0 20px rgba(255, 165, 0, 0.6), 
                        -15px 0 20px rgba(255, 165, 0, 0.6),
                        15px 0 40px rgba(255, 69, 0, 0.4),
                        -15px 0 40px rgba(255, 69, 0, 0.4);
            border: 3px solid #ff6b00;
        }

        th, td {
            border: 2px solid #333;
            padding: 16px 20px;
            text-align: left;
            font-size: 15px;
        }

        th {
            background-color: #000;
            color: white;
            font-weight: bold;
            text-align: center;
            border: 2px solid #666;
        }

        tbody tr:nth-child(2) {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            font-weight: bold;
            font-size: 17px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        tbody tr:nth-child(2) td:first-child::before {
            content: "🍓 ";
            margin-right: 8px;
        }

        tbody tr:nth-child(2) td:last-child::before {
            content: "🥇 ";
            margin-right: 8px;
        }

        tbody tr:nth-child(3) {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #000;
            font-weight: bold;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.2);
        }

        tbody tr:nth-child(3) td:first-child::before {
            content: "🍇 ";
            margin-right: 8px;
        }

        tbody tr:nth-child(3) td:last-child::before {
            content: "🥈 ";
            margin-right: 8px;
        }

        tbody tr:nth-child(4) {
            background: linear-gradient(135deg, #cd7f32, #e8af6b);
            color: #000;
            font-weight: bold;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.15);
        }

        tbody tr:nth-child(4) td:first-child::before {
            content: "🍨 ";
            margin-right: 8px;
        }

        tbody tr:nth-child(4) td:last-child::before {
            content: "🥉 ";
            margin-right: 8px;
        }

        tbody tr td {
            text-align: center;
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            background-color: orange;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>EXPL 💥</h1>
    <p>Welcome to EXPL💥</p>
</header>

<section>
    <h2>🔥 Produtos em Destaque</h2>
    <table>
        <tr>
            <th>Produto</th>
            <th>Lucro (R$)</th>
        </tr>
        <tr>
            <td>Explosion Morango</td>
            <td>6480.80</td>
        </tr>
        <tr>
            <td>Explosion Prime Uva</td>
            <td>5277.86</td>
        </tr>
        <tr>
            <td>Explosion Açaí</td>
            <td>3529.55</td>
        </tr>
    </table>
</section>

<section>
    <h2>📞 Contato</h2>
    <p>Quer saber mais sobre nossos produtos?</p>
    <button onclick="alert('Entraremos em contato em breve!')">
        Fale com a gente
    </button>
</section>

<footer>
    <p>© 2026 EXPL Company</p>
</footer>

</body>
</html>
